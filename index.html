<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A4A">
  <title>Mis Tareas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ PANTALLA DE LOGIN ============ -->
  <section id="pantallaLogin" class="login" hidden>
    <div class="login-caja">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>Mis Tareas</h1>
      <p class="login-sub">Entra con tu correo y contraseña.</p>
      <form id="formLogin">
        <label>Correo
          <input type="email" id="loginCorreo" autocomplete="email" required>
        </label>
        <label>Contraseña
          <input type="password" id="loginClave" autocomplete="current-password" required>
        </label>
        <label class="check-linea">
          <input type="checkbox" id="loginRecordar" checked>
          Recordarme en este celular
        </label>
        <button type="submit" class="btn primario ancho" id="btnEntrar">Entrar</button>
        <p class="error" id="loginError" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- ============ APP PRINCIPAL ============ -->
  <div id="pantallaApp" hidden>
    <header class="cabecera">
      <div class="cabecera-fila">
        <div>
          <p class="saludo" id="saludo">Hola</p>
          <h1 id="fechaHoy">Hoy</h1>
        </div>
        <div class="cabecera-botones">
          <button class="icono-btn" id="btnInstalar" hidden title="Instalar app" aria-label="Instalar app">⬇</button>
          <button class="icono-btn" id="btnNotificaciones" title="Activar recordatorios" aria-label="Activar recordatorios">🔔</button>
          <button class="icono-btn" id="btnSalir" title="Cerrar sesión" aria-label="Cerrar sesión">⎋</button>
        </div>
      </div>

      <!-- Filtro por categoría -->
      <div class="chips" id="chipsCategorias" aria-label="Filtrar por categoría"></div>
    </header>

    <main id="contenido">
      <!-- Aquí JavaScript pinta la vista activa -->
    </main>

    <!-- Barra inferior: vistas + acciones -->
    <nav class="barra-inferior" aria-label="Vistas">
      <button data-vista="hoy" class="activa"><span>☀</span>Hoy</button>
      <button data-vista="semana"><span>☷</span>Semana</button>
      <button class="mic" id="btnVoz" aria-label="Agregar tarea por voz">🎙</button>
      <button data-vista="calendario"><span>▦</span>Calendario</button>
      <button data-vista="categorias"><span>◧</span>Categorías</button>
    </nav>

    <button class="fab" id="btnNuevaTarea" aria-label="Nueva tarea">+</button>
  </div>

  <!-- ============ DIÁLOGO: TAREA ============ -->
  <dialog id="dlgTarea">
    <form id="formTarea">
      <h2 id="dlgTareaTitulo">Nueva tarea</h2>
      <p class="transcripcion" id="transcripcion" hidden></p>

      <label>Tarea
        <input type="text" id="tTitulo" required maxlength="140" placeholder="Ej: Contenido de Instagram">
      </label>

      <label>Categoría
        <select id="tCategoria" required></select>
      </label>

      <div class="dos-columnas">
        <label>Fecha límite
          <input type="date" id="tFecha">
        </label>
        <label>Hora
          <input type="time" id="tHora">
        </label>
      </div>

      <div class="dos-columnas">
        <label>Prioridad
          <select id="tPrioridad">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>
        <label>Avisarme
          <select id="tRecordar">
            <option value="0">El mismo día</option>
            <option value="1">1 día antes</option>
            <option value="2" selected>2 días antes</option>
            <option value="3">3 días antes</option>
            <option value="7">1 semana antes</option>
          </select>
        </label>
      </div>

      <fieldset class="subtareas-editor">
        <legend>Subtareas</legend>
        <ol id="listaSubEditor"></ol>
        <button type="button" class="btn suave" id="btnAgregarSub">+ Agregar subtarea</button>
      </fieldset>

      <label>Notas
        <textarea id="tNotas" rows="2" placeholder="Enlaces, detalles…"></textarea>
      </label>

      <div class="acciones">
        <button type="button" class="btn suave peligro" id="btnEliminarTarea" hidden>Eliminar</button>
        <span class="espacio"></span>
        <button type="button" class="btn suave" data-cerrar>Cancelar</button>
        <button type="submit" class="btn primario">Guardar tarea</button>
      </div>
    </form>
  </dialog>

  <!-- ============ DIÁLOGO: CATEGORÍA ============ -->
  <dialog id="dlgCategoria">
    <form id="formCategoria">
      <h2 id="dlgCatTitulo">Nueva categoría</h2>
      <label>Nombre
        <input type="text" id="cNombre" required maxlength="40" placeholder="Ej: Universidad">
      </label>
      <p class="etiqueta">Color</p>
      <div class="colores" id="paletaColores"></div>
      <div class="acciones">
        <button type="button" class="btn suave peligro" id="btnEliminarCat" hidden>Eliminar</button>
        <span class="espacio"></span>
        <button type="button" class="btn suave" data-cerrar>Cancelar</button>
        <button type="submit" class="btn primario">Guardar categoría</button>
      </div>
    </form>
  </dialog>

  <!-- Indicador de escucha -->
  <div class="escuchando" id="escuchando" hidden>
    <div class="onda"></div>
    <p>Te escucho… toca el micrófono para terminar</p>
    <p class="ayuda-voz">Ej: "Nueva tarea, categoría Planecitos, tarea Lanzar web, subtareas: uno, crear contenido; dos, subir la web; para el viernes"</p>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Librería de Supabase (gratis) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- Nuestros archivos, en este orden -->
  <script src="js/config.js"></script>
  <script src="js/fechas.js"></script>
  <script src="js/db.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/calendario.js"></script>
  <script src="js/notificaciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
